app = "maxim-zozulya-card"
primary_region = "arn"

[build]

[env]
  SEED_ON_START = "true"
  GRAPHQL_PATH = "/graphql"
  DEBUG_SQL = "false"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
