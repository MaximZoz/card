services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: card
    volumes:
      - card-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card -d card"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "5433:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://card:card@postgres:5432/card?schema=public
      PORT: "3000"
      GRAPHQL_PATH: /graphql
      SEED_ON_START: "true"
      DEBUG_SQL: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  card-data:
